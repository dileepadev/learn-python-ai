name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check Astro, TypeScript and content schemas
        run: npm run check

      - name: Build the static site
        run: npm run build
